<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2141" viewBox="0 0 2400 2141" role="img" aria-labelledby="title desc">
<title id="title">NFL player performance complete source-to-product column model</title>
<desc id="desc">Every physical table column, key role, relationship and reporting output is shown with source and transformation context.</desc>
<rect width="2400" height="2141" fill="#f4f7fa"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172c43}.title{font-size:32px;font-weight:700}.head{font-size:23px;font-weight:700}.field{font-family:Consolas,monospace;font-size:20px}.note{font-size:19px;fill:#506275}.small{font-size:16px;fill:#506275}.relation{font-family:Consolas,monospace;font-size:18px}</style>
<text x="40" y="48" class="title">NFL player performance | Source → modeled tables → analytical products</text>
<text x="40" y="82" class="note">PK primary key · FK foreign key · UQ alternate key · ? nullable · Composite keys and cardinalities are listed in the relationship register.</text>
<rect x="40" y="115" width="1120" height="260" rx="9" fill="white" stroke="#b6cbd6"/>
<text x="60" y="150" class="head">SOURCE DATASETS</text>
<text x="60" y="190" class="field">player_week.csv | one player / season / type / week</text>
<text x="60" y="218" class="field">player_id · player_display_name · position</text>
<text x="60" y="246" class="field">season · week · season_type · game_id</text>
<text x="60" y="274" class="field">team · opponent_team</text>
<text x="60" y="302" class="field">9 count columns + 3 yardage columns (listed below)</text>
<text x="60" y="330" class="field">Optional parameter: expected season</text>
<rect x="1200" y="115" width="1160" height="260" rx="9" fill="white" stroke="#b6cbd6"/>
<text x="1220" y="150" class="head">TRANSFORMATIONS</text>
<text x="1220" y="190" class="field">Select REG QB/RB/WR/TE; report scope exclusions</text>
<text x="1220" y="218" class="field">Validate identifiers, counts and unique player-week</text>
<text x="1220" y="246" class="field">Extract player / observed profile / team / week rows</text>
<text x="1220" y="274" class="field">Generate surrogate keys and canonical snapshot</text>
<text x="1220" y="302" class="field">Resolve team + opponent roles; load weekly facts</text>
<text x="1220" y="330" class="field">Reconcile all measures and row counts; publish views</text>
<rect x="40" y="420" width="750" height="201" rx="9" fill="white" stroke="#b6cbd6"/>
<text x="60" y="455" class="head">dim_player</text>
<text x="60" y="495" class="field">PK player_key : INTEGER</text>
<text x="60" y="523" class="field">UQ player_id : TEXT</text>
<text x="60" y="578" class="note">Grain: One stable source player ID</text>
<text x="60" y="604" class="small">Key: player_key</text>
<rect x="825" y="420" width="750" height="257" rx="9" fill="white" stroke="#b6cbd6"/>
<text x="845" y="455" class="head">dim_player_profile</text>
<text x="845" y="495" class="field">PK profile_key : INTEGER</text>
<text x="845" y="523" class="field">FK player_key : INTEGER</text>
<text x="845" y="551" class="field">   player_display_name : TEXT</text>
<text x="845" y="579" class="field">   position : TEXT</text>
<text x="845" y="634" class="note">Grain: One player + reported name + position</text>
<text x="845" y="660" class="small">Key: profile_key</text>
<rect x="1610" y="420" width="750" height="201" rx="9" fill="white" stroke="#b6cbd6"/>
<text x="1630" y="455" class="head">dim_team</text>
<text x="1630" y="495" class="field">PK team_key : INTEGER</text>
<text x="1630" y="523" class="field">UQ team_code : TEXT</text>
<text x="1630" y="578" class="note">Grain: One source team code</text>
<text x="1630" y="604" class="small">Key: team_key</text>
<rect x="40" y="717" width="750" height="257" rx="9" fill="white" stroke="#b6cbd6"/>
<text x="60" y="752" class="head">dim_season_week</text>
<text x="60" y="792" class="field">PK week_key : INTEGER</text>
<text x="60" y="820" class="field">   season : INTEGER</text>
<text x="60" y="848" class="field">   season_type : TEXT</text>
<text x="60" y="876" class="field">   week : INTEGER</text>
<text x="60" y="931" class="note">Grain: One season + season type + week</text>
<text x="60" y="957" class="small">Key: week_key</text>
<rect x="825" y="717" width="750" height="285" rx="9" fill="white" stroke="#b6cbd6"/>
<text x="845" y="752" class="head">model_snapshot</text>
<text x="845" y="792" class="field">PK snapshot_key : INTEGER</text>
<text x="845" y="820" class="field">UQ canonical_sha256 : TEXT</text>
<text x="845" y="848" class="field">   first_payload_sha256 : TEXT</text>
<text x="845" y="876" class="field">   accepted_rows : INTEGER</text>
<text x="845" y="904" class="field">   loaded_at_utc : TEXT</text>
<text x="845" y="959" class="note">Grain: One canonical accepted source revision</text>
<text x="845" y="985" class="small">Key: snapshot_key</text>
<rect x="1610" y="717" width="750" height="677" rx="9" fill="#e4f3f1" stroke="#b6cbd6"/>
<text x="1630" y="752" class="head">fact_player_week</text>
<text x="1630" y="792" class="field">PK/FK snapshot_key : INTEGER</text>
<text x="1630" y="820" class="field">PK/FK week_key : INTEGER</text>
<text x="1630" y="848" class="field">PK/FK player_key : INTEGER</text>
<text x="1630" y="876" class="field">FK profile_key : INTEGER</text>
<text x="1630" y="904" class="field">FK team_key : INTEGER</text>
<text x="1630" y="932" class="field">FK opponent_team_key : INTEGER</text>
<text x="1630" y="960" class="field">   game_id : TEXT</text>
<text x="1630" y="988" class="field">   completions : INTEGER</text>
<text x="1630" y="1016" class="field">   attempts : INTEGER</text>
<text x="1630" y="1044" class="field">   passing_tds : INTEGER</text>
<text x="1630" y="1072" class="field">   passing_interceptions : INTEGER</text>
<text x="1630" y="1100" class="field">   carries : INTEGER</text>
<text x="1630" y="1128" class="field">   rushing_tds : INTEGER</text>
<text x="1630" y="1156" class="field">   targets : INTEGER</text>
<text x="1630" y="1184" class="field">   receptions : INTEGER</text>
<text x="1630" y="1212" class="field">   receiving_tds : INTEGER</text>
<text x="1630" y="1240" class="field">   passing_yards : INTEGER</text>
<text x="1630" y="1268" class="field">   rushing_yards : INTEGER</text>
<text x="1630" y="1296" class="field">   receiving_yards : INTEGER</text>
<text x="1630" y="1351" class="note">Grain: One player + season/type/week per snapshot</text>
<text x="1630" y="1377" class="small">Key: snapshot_key + week_key + player_key</text>
<text x="40" y="1439" class="head">RELATIONSHIPS | child columns → parent columns</text>
<text x="60" y="1476" class="relation">dim_player_profile (player_key) → dim_player (player_key)</text>
<text x="2090" y="1476" class="small">1 parent / 0..many children</text>
<text x="60" y="1505" class="relation">fact_player_week (profile_key, player_key) → dim_player_profile (profile_key, player_key)</text>
<text x="2090" y="1505" class="small">1 parent / 0..many children</text>
<text x="60" y="1534" class="relation">fact_player_week (opponent_team_key) → dim_team (team_key)</text>
<text x="2090" y="1534" class="small">1 parent / 0..many children</text>
<text x="60" y="1563" class="relation">fact_player_week (team_key) → dim_team (team_key)</text>
<text x="2090" y="1563" class="small">1 parent / 0..many children</text>
<text x="60" y="1592" class="relation">fact_player_week (player_key) → dim_player (player_key)</text>
<text x="2090" y="1592" class="small">1 parent / 0..many children</text>
<text x="60" y="1621" class="relation">fact_player_week (week_key) → dim_season_week (week_key)</text>
<text x="2090" y="1621" class="small">1 parent / 0..many children</text>
<text x="60" y="1650" class="relation">fact_player_week (snapshot_key) → model_snapshot (snapshot_key)</text>
<text x="2090" y="1650" class="small">1 parent / 0..many children</text>
<text x="40" y="1714" class="head">PUBLISHED DATA PRODUCTS | every reporting-view output column</text>
<text x="40" y="1762" class="note">fact_player_week — Weekly performance data product</text>
<text x="60" y="1792" class="relation">Trace each count and yard total to player/week, team/opponent and source snapshot</text>
<text x="40" y="1845" class="note">v_player_week — Reconstructed analytical detail</text>
<text x="60" y="1875" class="relation">snapshot_key · player_id · player_display_name · position · season · week · season_type · game_id · team · opponent_team · completions · attempts</text>
<text x="60" y="1902" class="relation">passing_tds · passing_interceptions · carries · rushing_tds · targets · receptions · receiving_tds · passing_yards · rushing_yards · receiving_yards</text>
<text x="40" y="1952" class="note">v_player_season_totals — Season-level reporting product</text>
<text x="60" y="1982" class="relation">snapshot_key · season · season_type · player_id · observed_weeks · attempts · passing_yards · carries · rushing_yards · targets · receiving_yards</text>
<text x="60" y="2009" class="relation">yards_per_attempt · yards_per_carry · yards_per_target · catch_rate</text>
<text x="40" y="2066" class="note">Generated from implemented SQLite tables. Source mappings, full unique constraints and loaded example rows accompany this diagram.</text>
<text x="40" y="2101" class="note">Local implementation | No new cloud deployment or reference-data enrichment claimed</text>
</svg>