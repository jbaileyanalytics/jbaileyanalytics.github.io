<text x="65" y="75" fill="#a9d8c8" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">HEALTHCARE ANALYTICS</text><text x="65" y="133" fill="#f5fbfa" font-family="Arial,sans-serif" font-size="36" font-weight="700">From source records to decisions.</text>
<g font-family="Arial,sans-serif"><rect x="65" y="204" width="300" height="240" rx="12" fill="#eef5f2"/><rect x="450" y="204" width="300" height="240" rx="12" fill="#eef5f2"/><rect x="835" y="204" width="300" height="240" rx="12" fill="#d6ece2"/>
