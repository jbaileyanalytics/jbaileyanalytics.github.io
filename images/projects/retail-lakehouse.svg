<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="t d"><title id="t">Retail lakehouse architecture</title><desc id="d">Seven source files pass through Python ingestion, raw Parquet storage, DuckDB and dbt transformations, and Power BI reporting.</desc><rect width="1600" height="820" fill="#173445"/><text x="92" y="105" fill="#b8ddca" font-family="Arial" font-size="20" letter-spacing="3" font-weight="700">RETAIL LAKEHOUSE</text><text x="92" y="166" fill="#f5faf7" font-family="Arial" font-size="42" font-weight="600">From seven sources to decision-ready data.</text><text x="92" y="211" fill="#c4d6d8" font-family="Arial" font-size="21">A local engineering and analytics workflow</text><g font-family="Arial"><rect x="92" y="295" width="306" height="235" rx="8" fill="#eaf2ee"/><rect x="460" y="295" width="306" height="235" rx="8" fill="#eaf2ee"/><rect x="828" y="295" width="306" height="235" rx="8" fill="#eaf2ee"/><rect x="1196" y="295" width="306" height="235" rx="8" fill="#d8eae0"/><g fill="#126658" font-size="16" font-weight="700" letter-spacing="2"><text x="120" y="341">01 / ACQUIRE</text><text x="488" y="341">02 / PRESERVE</text><text x="856" y="341">03 / MODEL</text><text x="1224" y="341">04 / REPORT</text></g><g fill="#173445" font-size="27" font-weight="600"><text x="120" y="401">Source files</text><text x="488" y="401">Raw Parquet</text><text x="856" y="401">DuckDB + dbt</text><text x="1224" y="401">Power BI</text></g><g fill="#49636b" font-size="19"><text x="120" y="446">Seven CSV inputs</text><text x="120" y="478">Python + source hashes</text><text x="488" y="446">Source-row lineage</text><text x="488" y="478">Original fields retained</text><text x="856" y="446">Validation + SQL models</text><text x="856" y="478">Reconciliation tests</text><text x="1224" y="446">Sales + inventory</text><text x="1224" y="478">Data-quality view</text></g></g><g stroke="#9ed0b8" stroke-width="4" fill="none"><path d="M398 414h62m-12-10 12 10-12 10"/><path d="M766 414h62m-12-10 12 10-12 10"/><path d="M1134 414h62m-12-10 12 10-12 10"/></g><path d="M92 611h1410" stroke="#6a858d"/><g font-family="Arial" fill="#d7e9e2" font-size="19"><text x="92" y="665">7 SOURCES</text><text x="477" y="665">128,975 SALES LINES</text><text x="912" y="665">24 DBT TESTS</text><text x="1250" y="665">LOCAL BUILD</text><text x="92" y="731" font-size="16" fill="#b6ccca">Historical dataset; source limitations and data quality are documented.</text></g><image x="340" y="309" width="38" height="38" href="data:image/svg+xml;base64,"/><image x="708" y="309" width="38" height="38" href="data:image/svg+xml;base64,"/><image x="1035" y="309" width="36" height="36" href="data:image/svg+xml;base64,"/><image x="1082" y="309" width="36" height="36" href="data:image/svg+xml;base64,"/><image x="1444" y="309" width="38" height="38" href="data:image/svg+xml;base64,"/></svg>
